<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <title>ReelMaker - Offline Reel Video Generator</title>
  <meta name="description" content="Generate beautiful aesthetic quote & status reel videos offline with Bengali typography, custom music, and doodle backgrounds. Works 100% in browser." />
  <meta name="theme-color" content="#6C3BFF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ReelMaker" />
  <meta name="application-name" content="ReelMaker" />

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- App Favicons & Icons for Web, Android & iOS -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />

  <!-- Local Offline CSS Stylesheets -->
  <link rel="stylesheet" href="css/styles.css?v=2.2.0" />
  <link rel="stylesheet" href="css/editor.css?v=2.2.0" />
  <link rel="stylesheet" href="css/timeline.css?v=2.2.0" />
  <link rel="stylesheet" href="css/responsive.css?v=2.2.0" />
</head>
<body>
  <div id="app-container">
    <!-- ================= Top Application Toolbar ================= -->
    <header class="app-header" role="banner">
      <div class="header-left">
        <a href="#" class="app-brand" aria-label="ReelMaker Home">
          <img src="assets/icons/app-icon.svg" alt="ReelMaker Logo" class="brand-logo-img" />
          <span class="brand-name">Reel<span>Maker</span></span>
        </a>

        <div class="project-title-wrapper">
          <input type="text" id="input-project-title" class="project-title-input" value="Reel by Rmaker" placeholder="Reel by Rmaker" title="Rename Project" aria-label="Project Title" />
        </div>

        <div class="save-badge" id="save-status-badge">
          <span class="status-dot dot-green"></span> Saved
        </div>
      </div>

      <div class="header-center">
        <!-- Undo / Redo -->
        <div class="btn-group undo-redo-group" id="group-undo-redo">
          <button id="btn-undo" class="btn-tool" title="Undo (Ctrl+Z)" disabled aria-label="Undo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          </button>
          <button id="btn-redo" class="btn-tool" title="Redo (Ctrl+Shift+Z)" disabled aria-label="Redo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
          </button>
        </div>

        <div class="header-sep sep-undo-redo"></div>

        <!-- Aspect Ratio Switcher -->
        <div class="ratio-selector-group" role="radiogroup" aria-label="Aspect Ratio">
          <button class="ratio-pill active" data-ratio="9:16" title="TikTok / Reels (9:16)">9:16</button>
          <button class="ratio-pill" data-ratio="1:1" title="Square Post (1:1)">1:1</button>
          <button class="ratio-pill" data-ratio="4:5" title="Portrait Post (4:5)">4:5</button>
        </div>

        <div class="header-sep"></div>

        <!-- Safe Area Toggle -->
        <button id="btn-safe-area" class="btn-icon active" title="Toggle Reels Safe Area Guides" aria-label="Toggle Safe Area">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 3v18"/><path d="M15 3v18"/><path d="M3 9h18"/><path d="M3 15h18"/></svg>
        </button>
      </div>

      <div class="header-right">
        <div class="offline-badge" id="offline-indicator">
          <span class="status-dot dot-green"></span> Offline Ready
        </div>

        <!-- Unified Save & Project Menu Dropdown -->
        <div class="project-menu-wrapper" id="project-menu-container">
          <button id="btn-project-menu" class="btn btn-primary btn-sm btn-project-menu" title="Project Actions & Export" aria-label="Project Menu" aria-haspopup="true" aria-expanded="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            <span class="project-menu-btn-text">Save / Export</span>
            <svg class="menu-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>

          <!-- Dropdown Popover Menu -->
          <div class="project-dropdown-menu" id="project-dropdown-menu" role="menu" aria-label="Project Actions">
            <div class="dropdown-header">
              <span class="dropdown-header-title">Project & Video</span>
              <span class="save-status-text" id="menu-save-status">Saved locally</span>
            </div>

            <!-- 1. Save Project -->
            <button class="dropdown-item" id="menu-item-save" role="menuitem">
              <div class="dropdown-item-icon icon-save">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              </div>
              <div class="dropdown-item-content">
                <div class="dropdown-item-title">Save Project</div>
                <div class="dropdown-item-desc">Save changes to local browser storage</div>
              </div>
              <span class="kbd-shortcut">Ctrl+S</span>
            </button>

            <!-- 2. Create New Project -->
            <button class="dropdown-item" id="menu-item-new" role="menuitem">
              <div class="dropdown-item-icon icon-new">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </div>
              <div class="dropdown-item-content">
                <div class="dropdown-item-title">Create New Project</div>
                <div class="dropdown-item-desc">Start fresh with a clean canvas</div>
              </div>
            </button>

            <!-- 3. Open Saved Projects -->
            <button class="dropdown-item" id="menu-item-open" role="menuitem">
              <div class="dropdown-item-icon icon-open">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              </div>
              <div class="dropdown-item-content">
                <div class="dropdown-item-title">Open Saved Projects</div>
                <div class="dropdown-item-desc">Browse local reels and presets</div>
              </div>
            </button>

            <div class="dropdown-divider"></div>

            <!-- Export Video -->
            <button class="dropdown-item dropdown-item-primary" id="menu-item-export-video" role="menuitem">
              <div class="dropdown-item-icon icon-video">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              </div>
              <div class="dropdown-item-content">
                <div class="dropdown-item-title">Export Video</div>
                <div class="dropdown-item-desc">Render reel video (MP4 / WebM)</div>
              </div>
              <span class="badge-accent">Export</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- ================= Workspace Area ================= -->
    <main class="app-workspace" role="main">
      <!-- Left Sidebar Navigation -->
      <nav class="app-sidebar" role="navigation" aria-label="Editing Tools">
        <button class="sidebar-nav-btn active" data-tool="text" title="Text & Typography">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          <span>Text</span>
        </button>
        <button class="sidebar-nav-btn" data-tool="emoji" title="Emojis">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          <span>Emoji</span>
        </button>
        <button class="sidebar-nav-btn" data-tool="background" title="Background & Patterns">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>Backdrop</span>
        </button>
        <button class="sidebar-nav-btn" data-tool="shapes" title="Stickers & Shapes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>Shapes</span>
        </button>
        <button class="sidebar-nav-btn" data-tool="handle" title="Social Branding Handle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg>
          <span>Handle</span>
        </button>
        <button class="sidebar-nav-btn" data-tool="audio" title="Music & Audio Tracks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <span>Music</span>
        </button>
        <button class="sidebar-nav-btn" data-tool="templates" title="Pre-made Templates">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Templates</span>
        </button>
      </nav>

      <!-- Left Tool Drawers / Panels -->
      <div class="drawer-backdrop" id="tool-drawer-backdrop"></div>
      <aside class="app-tool-panels" id="tool-panels-drawer" role="complementary">
        <div class="drawer-mobile-header" id="drawer-mobile-header">
          <div class="drawer-drag-pill"></div>
          <span class="drawer-title" id="drawer-active-title">Editing Panel</span>
          <button class="drawer-close-btn" id="btn-close-tool-drawer" aria-label="Close Panel">&times;</button>
        </div>

        <!-- 1. Text Panel -->
        <section class="tool-panel-tab active" id="tab-text">
          <div id="panel-text-content"></div>
        </section>

        <!-- 2. Emoji Panel -->
        <section class="tool-panel-tab" id="tab-emoji">
          <div class="panel-section-header">
            <h4>Emoji Stickers</h4>
          </div>
          <div class="panel-body">
            <!-- Selected Emoji Layer Top Controls -->
            <div class="selected-layer-card" id="selected-emoji-card">
              <div class="selected-layer-header">
                <span class="selected-layer-badge">Selected Emoji Layer</span>
                <span class="selected-layer-preview" id="preview-selected-emoji">🥀</span>
              </div>
              <div class="form-group" style="margin-bottom: 10px;">
                <div class="slider-label-row">
                  <label for="input-emoji-size">Selected Emoji Size:</label>
                  <span class="slider-value-badge" id="val-emoji-size">64px</span>
                </div>
                <input type="range" id="input-emoji-size" min="24" max="180" value="64" />
              </div>
              <button class="btn btn-danger btn-sm btn-block" id="btn-delete-emoji-layer" title="Delete this emoji layer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                <span>Delete Emoji Layer</span>
              </button>
            </div>

            <div class="panel-divider"></div>

            <div class="form-group">
              <label class="form-section-title">Add Emoji Sticker:</label>
              <div class="emoji-picker-grid" id="emoji-grid"></div>
            </div>
          </div>
        </section>

        <!-- 3. Background Panel -->
        <section class="tool-panel-tab" id="tab-background">
          <div id="panel-bg-content"></div>
        </section>

        <!-- 4. Shapes Panel -->
        <section class="tool-panel-tab" id="tab-shapes">
          <div class="panel-section-header">
            <h4>Decorations & Shapes</h4>
          </div>
          <div class="panel-body">
            <!-- Selected Deco / Shape Layer Top Controls -->
            <div class="selected-layer-card" id="selected-shape-card">
              <div class="selected-layer-header">
                <span class="selected-layer-badge">Selected Deco Layer</span>
                <span class="selected-layer-name" id="label-selected-shape">QuoteMarks</span>
              </div>
              <div class="form-row" style="margin-bottom: 10px;">
                <div class="form-group flex-1">
                  <label for="input-shape-color">Color:</label>
                  <div class="color-picker-wrapper">
                    <input type="color" id="input-shape-color" value="#685B53" />
                    <span class="color-val-badge" id="val-shape-color">#685B53</span>
                  </div>
                </div>
                <div class="form-group flex-1">
                  <div class="slider-label-row">
                    <label for="input-shape-size">Size:</label>
                    <span class="slider-value-badge" id="val-shape-size">60px</span>
                  </div>
                  <input type="range" id="input-shape-size" min="20" max="250" value="60" />
                </div>
              </div>
              <button class="btn btn-danger btn-sm btn-block" id="btn-delete-shape-layer" title="Delete this deco layer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                <span>Delete Deco Layer</span>
              </button>
            </div>

            <div class="panel-divider"></div>

            <div class="form-group">
              <label class="form-section-title">Add Decorative Shape / Doodle:</label>
              <div class="shapes-picker-grid" id="shapes-grid"></div>
            </div>
          </div>
        </section>

        <!-- 5. Social Handle Panel -->
        <section class="tool-panel-tab" id="tab-handle">
          <div class="panel-section-header">
            <h4>Creator Branding</h4>
          </div>
          <div class="panel-body">
            <div class="form-group checkbox-group">
              <label>
                <input type="checkbox" id="check-handle-enable" checked />
                <span>Show Creator Handle</span>
              </label>
            </div>
            <div class="form-group">
              <label for="input-handle-text">Handle Text:</label>
              <input type="text" id="input-handle-text" class="form-input" value="@yourname" />
            </div>
            <div class="form-group">
              <label for="select-handle-pos">Position Preset:</label>
              <select id="select-handle-pos" class="form-select">
                <option value="bottom-center" selected>Bottom Center</option>
                <option value="bottom-left">Bottom Left</option>
                <option value="bottom-right">Bottom Right</option>
              </select>
            </div>
            <div class="form-row">
              <div class="form-group flex-1">
                <label for="input-handle-color">Color:</label>
                <input type="color" id="input-handle-color" value="#5A5049" />
              </div>
              <div class="form-group flex-1">
                <label for="input-handle-size">Font Size:</label>
                <input type="number" id="input-handle-size" class="form-input" min="16" max="44" value="26" />
              </div>
            </div>
            <div class="form-group checkbox-group">
              <label>
                <input type="checkbox" id="check-handle-badge" checked />
                <span>Translucent Pill Badge</span>
              </label>
            </div>
          </div>
        </section>

        <!-- 6. Music / Audio Panel -->
        <section class="tool-panel-tab" id="tab-audio">
          <div class="panel-section-header">
            <h4>Audio & Music</h4>
          </div>
          <div class="panel-body">
            <div class="form-group checkbox-group">
              <label>
                <input type="checkbox" id="check-audio-enable" checked />
                <span>Enable Music in Video</span>
              </label>
            </div>

            <div class="form-group">
              <label for="select-bundled-audio">Bundled Royalty-Free Tracks:</label>
              <select id="select-bundled-audio" class="form-select">
                <option value="lofi-peace" selected>Lofi Peace (Chill & Calm)</option>
                <option value="sad-acoustic">Sad Acoustic (Emotional)</option>
                <option value="cinematic-piano">Cinematic Piano (Inspirational)</option>
                <option value="deep-ambient">Deep Ambient (Focus & Dreamy)</option>
                <option value="night-vibes">Night Vibes (Chill Lofi Beat)</option>
                <option value="uplifting-acoustic">Uplifting Acoustic (Hopeful)</option>
                <option value="midnight-rain">Midnight Rain (Peaceful & Cozy)</option>
                <option value="minimal-pulse">Minimal Pulse (Modern & Sleek)</option>
              </select>
            </div>

            <div class="form-group">
              <label class="file-drop-zone">
                <input type="file" id="input-audio-file" accept="audio/*" style="display:none;" />
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                <span>Import Local Audio File (MP3, WAV)</span>
              </label>
            </div>

            <!-- Active / Imported Audio File Display Card -->
            <div class="selected-layer-card" id="imported-audio-card" style="display: none;">
              <div class="selected-layer-header">
                <div class="selected-layer-badge">
                  <span class="selected-layer-preview">🎵</span>
                  <span class="selected-layer-name" id="label-imported-audio-name">audio-file.mp3</span>
                </div>
                <span class="audio-type-pill" id="badge-imported-audio-type">Imported File</span>
              </div>
              <div class="audio-card-meta">
                <span id="text-imported-audio-meta">Custom local audio active</span>
                <button type="button" id="btn-remove-imported-audio" class="btn-text-danger" title="Revert to bundled music">Use Bundled Music</button>
              </div>
            </div>

            <div class="form-group">
              <label for="input-audio-volume">Music Volume:</label>
              <input type="range" id="input-audio-volume" min="0" max="1.0" step="0.05" value="0.85" />
            </div>

            <div class="form-group checkbox-group">
              <label>
                <input type="checkbox" id="check-audio-loop" checked />
                <span>Loop Audio if Shorter than Reel</span>
              </label>
            </div>

            <button class="btn btn-secondary btn-block" id="btn-preview-audio">
              <span>▶ Preview Music</span>
            </button>
          </div>
        </section>
      </aside>

      <!-- Center Viewport with Interactive Canvas -->
      <section class="canvas-viewport-wrapper" aria-label="Video Composition Preview">
        <div class="canvas-viewport" id="canvas-viewport">
          <canvas id="preview-canvas" width="1080" height="1920"></canvas>
        </div>
      </section>
    </main>

    <!-- ================= Bottom Multitrack Timeline ================= -->
    <footer id="timeline-container" role="contentinfo" aria-label="Video Multitrack Timeline">
      <!-- Injected dynamically by timeline.js -->
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Main ES6 Application Orchestrator -->
  <script type="module" src="js/app.js?v=2.2.0"></script>
</body>
</html>
