<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60" fill="none" stroke="#685B53" stroke-width="1.2" stroke-linecap="round">
  <!-- Minimalist Aesthetic Vintage Journal Grid with Intersection Marks -->
  <line x1="0" y1="30" x2="60" y2="30" opacity="0.35" stroke-dasharray="1 3" />
  <line x1="30" y1="0" x2="30" y2="60" opacity="0.35" stroke-dasharray="1 3" />

  <!-- Corner cross marks -->
  <path d="M 0 4 L 0 -4 M -4 0 L 4 0" opacity="0.45" stroke-width="1.2" />
  <path d="M 60 4 L 60 -4 M 56 0 L 64 0" opacity="0.45" stroke-width="1.2" />
  <path d="M 0 64 L 0 56 M -4 60 L 4 60" opacity="0.45" stroke-width="1.2" />
  <path d="M 60 64 L 60 56 M 56 60 L 64 60" opacity="0.45" stroke-width="1.2" />

  <!-- Center subtle cross stitch mark -->
  <path d="M 30 26 L 30 34 M 26 30 L 34 30" opacity="0.5" stroke-width="1.4" />
</svg>
