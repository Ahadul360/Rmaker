<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none" stroke="#685B53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Hand-drawn Butterfly 1 -->
  <g transform="translate(24, 20) rotate(-15)">
    <!-- Left wings -->
    <path d="M 0 0 C -12 -14 -22 -4 -16 6 C -12 12 -4 8 0 2" opacity="0.8" />
    <path d="M 0 2 C -10 4 -14 14 -8 18 C -2 20 0 10 0 2" opacity="0.75" />
    <!-- Right wings -->
    <path d="M 0 0 C 12 -14 22 -4 16 6 C 12 12 4 8 0 2" opacity="0.8" />
    <path d="M 0 2 C 10 4 14 14 8 18 C 2 20 0 10 0 2" opacity="0.75" />
    <!-- Body & Antennae -->
    <line x1="0" y1="-2" x2="0" y2="12" stroke-width="2" opacity="0.85" />
    <path d="M -1 -2 Q -4 -8 -8 -9" opacity="0.7" />
    <path d="M 1 -2 Q 4 -8 8 -9" opacity="0.7" />
  </g>

  <!-- Mini Butterfly 2 -->
  <g transform="translate(86, 75) rotate(20) scale(0.65)">
    <path d="M 0 0 C -12 -14 -20 -4 -14 6 C -10 12 -4 8 0 2" opacity="0.7" />
    <path d="M 0 2 C -8 4 -12 12 -6 16 C -2 18 0 8 0 2" opacity="0.65" />
    <path d="M 0 0 C 12 -14 20 -4 14 6 C 10 12 4 8 0 2" opacity="0.7" />
    <path d="M 0 2 C 8 4 12 12 6 16 C 2 18 0 8 0 2" opacity="0.65" />
    <line x1="0" y1="-2" x2="0" y2="10" stroke-width="2" opacity="0.75" />
  </g>

  <!-- Dotted flight trails & sparkles -->
  <path d="M 45 42 Q 62 48 76 65" stroke-dasharray="2 4" stroke-width="1.3" opacity="0.5" />
  <path d="M 92 24 L 92 34 M 87 29 L 97 29" opacity="0.65" />
  <circle cx="20" cy="85" r="1.5" fill="#685B53" stroke="none" opacity="0.45" />
  <circle cx="68" cy="95" r="1.5" fill="#685B53" stroke="none" opacity="0.45" />
</svg>
