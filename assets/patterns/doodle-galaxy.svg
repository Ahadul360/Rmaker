<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none" stroke="#685B53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ringed Planet (Saturn) -->
  <g transform="translate(35, 32)">
    <circle cx="0" cy="0" r="10" opacity="0.8" />
    <!-- Planet Ring -->
    <path d="M -18 4 Q 0 -8 18 -4" opacity="0.75" />
    <path d="M 18 -4 Q 0 10 -18 4" opacity="0.75" />
  </g>

  <!-- Shooting Star -->
  <g transform="translate(85, 25)">
    <path d="M 0 0 Q 0 8 -8 8 Q 0 8 0 16 Q 0 8 8 8 Q 0 8 0 0 Z" opacity="0.8" />
    <line x1="-6" y1="2" x2="-18" y2="-4" stroke-dasharray="2 3" opacity="0.5" stroke-width="1.3" />
    <line x1="-3" y1="0" x2="-15" y2="-8" stroke-dasharray="2 3" opacity="0.5" stroke-width="1.3" />
  </g>

  <!-- Crescent Moon -->
  <path d="M 88 80 C 82 84 82 94 88 98 C 84 98 78 92 80 82 C 81 81 85 80 88 80 Z" opacity="0.75" />

  <!-- Constellation dots & sparkles -->
  <path d="M 22 88 L 22 96 M 18 92 L 26 92" opacity="0.65" />
  <circle cx="60" cy="72" r="1.5" fill="#685B53" stroke="none" opacity="0.5" />
  <circle cx="98" cy="55" r="1.5" fill="#685B53" stroke="none" opacity="0.5" />
  <circle cx="28" cy="62" r="1.2" fill="#685B53" stroke="none" opacity="0.4" />
</svg>
